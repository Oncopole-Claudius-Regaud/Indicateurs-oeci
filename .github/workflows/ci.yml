name: Deploy Indicateurs OECI

on:
  push:
    branches:
      - dynamique_organe

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Deploy using git reset --hard
        shell: bash
        run: |
          set -euo pipefail

          TARGET="$HOME/airflow/dags/Indicateurs-oeci"
          SRC="$GITHUB_WORKSPACE"
          SHA="$GITHUB_SHA"
          BRANCH="$GITHUB_REF_NAME"

          # 1) Clone initial depuis le workspace (pas besoin d'auth)
          if [ ! -d "$TARGET/.git" ]; then
            rm -rf "$TARGET"
            git clone "$SRC" "$TARGET"
          fi

          # 2) Mettre TARGET exactement sur le commit du push
          git -C "$TARGET" fetch "$SRC" "$SHA"
          git -C "$TARGET" checkout -B "$BRANCH" "$SHA"
          git -C "$TARGET" reset --hard "$SHA"
          git -C "$TARGET" clean -fd